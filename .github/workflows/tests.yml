name: llama_manager_tests
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install pytest-cov
          pip install ruff

      - name: Run tests
        run: pytest tests/

      - name: Code coverage
        run: pytest --cov=llama_manager tests/

      - name: Lint files
        run: ruff check .
